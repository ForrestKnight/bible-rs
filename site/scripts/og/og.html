<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=block"
			rel="stylesheet"
		/>
		<style>
			:root{--bg:#fbfaf7;--fg:#1c1b19;--muted:#6b6862;--line:#e7e3dc;--accent:#2f4a8a}
			html,body{margin:0}
			body{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
			.copy{position:absolute;left:80px;top:0;bottom:0;width:440px;display:flex;flex-direction:column;justify-content:center}
			.icon{width:128px;height:128px;margin-left:-12px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.18))}
			h1{font-family:Literata,Georgia,serif;font-weight:500;font-size:124px;letter-spacing:-.02em;line-height:1;margin:18px 0 20px}
			p{margin:0;color:var(--muted);font-size:34px;line-height:1.3;text-wrap:balance}
			.meta{margin-top:30px;color:var(--muted);font-size:20px}
			.shot{position:absolute;left:560px;top:72px;width:760px;height:620px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.14)}
			.shot img{position:absolute;left:-206px;top:0;width:1060px}
		</style>
	</head>
	<body>
		<div class="copy">
			<img class="icon" src="../../static/icon.png" alt="" />
			<h1>Bible</h1>
			<p>A fast, native reader for the Mac</p>
			<div class="meta">Free · Apple Silicon and Intel</div>
		</div>
		<div class="shot"><img src="../../static/reader-light.jpg" alt="" /></div>
	</body>
</html>
