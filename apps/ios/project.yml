# The iPhone and iPad app. scripts/build-ios.sh builds the Rust core into
# Frameworks/BibleFFI.xcframework and Generated/BibleFFI.swift, then runs XcodeGen on this file
# to make Bible.xcodeproj; none of those three are checked in.
name: Bible
options:
  bundleIdPrefix: dev.bible-rs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Bible.xcconfig
  Release: Config/Bible.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Bible:
    type: application
    platform: iOS
    sources:
      - path: Bible
      - path: Generated/BibleFFI.swift
      # The Mac app's fonts, shared rather than copied.
      - path: ../../crates/app/assets/fonts/Literata.ttf
        buildPhase: resources
        group: Fonts
      - path: ../../crates/app/assets/fonts/Literata-Italic.ttf
        buildPhase: resources
        group: Fonts
      - path: ../../crates/app/assets/fonts/Inter.ttf
        buildPhase: resources
        group: Fonts
    dependencies:
      - framework: Frameworks/BibleFFI.xcframework
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Bible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Literata.ttf, Literata-Italic.ttf, Inter.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID)
        PRODUCT_NAME: Bible
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # The framework's simulator slice is Apple Silicon only (see scripts/build-ios.sh).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  BibleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BibleUITests
    dependencies:
      - target: Bible
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bible
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
schemes:
  Bible:
    build:
      targets:
        Bible: all
        BibleUITests: [test]
    run:
      config: Debug
    test:
      config: Release
      targets:
        - BibleUITests
    archive:
      config: Release
