[package]
name = "bible-rs"
description = "A fast, native Bible reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bible_rs"
path = "src/lib.rs"

[[bin]]
name = "bible-rs"
path = "src/main.rs"

[dependencies]
bible-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }
rfd = "0.17"
dirs = "6"

# PNG encoding for shared verse images.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: pasting through the compositor's data-control protocol (what wl-paste uses). eframe's
# first choice, smithay-clipboard, only sees the selection while it has keyboard focus and misses
# changes under Hyprland; egui-winit falls back to arboard, which this feature makes work on
# Wayland without focus.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Native menu bar and window chrome (macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSScreen",
    "NSSharingService",
    "NSToolbar",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }
# The 3D objects (objects/*.json): the website's pages in a WKWebView, served from the binary.
wry = { version = "0.57", default-features = false }

# Windows: the native menu bar, and the Win32 calls for links, local time, the console and the
# system's animation setting.
[target.'cfg(windows)'.dependencies]
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json.workspace = true
# The Windows executable's icon, version information and manifest (packaging/windows).
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false
