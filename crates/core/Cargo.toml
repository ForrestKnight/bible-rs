[package]
name = "bible-core"
description = "Translation model, importers, search and study storage for bible-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled", "tls"]
# Embed the public-domain translations from data/translations into the binary.
bundled = []
# HTTPS (rustls) for the online translations. The phone apps leave it out while they have no
# online translations, so their binaries carry no encryption code (App Store export rules).
tls = ["ureq/rustls"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
zstd.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["gzip"] }

# API keys live in the macOS Keychain; other platforms use a 0600 file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "load"
harness = false
