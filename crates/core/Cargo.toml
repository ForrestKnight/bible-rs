[package]
name = "bible-core"
description = "Translation model, importers, search and study storage for bible-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled", "native", "tls"]
# Embed the public-domain translations from data/translations into the binary.
bundled = []
# Files, SQLite and the network: the translation library, online translations, secrets and the
# study store's SQLite file. The web build leaves it out and keeps the model, `.bbl` files, chapter
# layout, search, references and the study store in memory.
native = ["import", "dep:rusqlite", "dep:ureq"]
# The importers (USFM, OSIS, Zefania, SWORD; zips), which the web build takes without `native`
# to convert files the reader picks in the browser.
import = ["dep:zip", "dep:flate2"]
# HTTPS (rustls) for the online translations. The phone apps leave it out while they have no
# online translations, so their binaries carry no encryption code (App Store export rules).
tls = ["native", "ureq/rustls"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
flate2 = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["gzip"], optional = true }

# The C zstd needs a C compiler that targets wasm; the browser decodes with a pure-Rust one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# The clock: std has none on wasm32-unknown-unknown.
js-sys = "0.3"

# API keys live in the macOS Keychain or the Windows Credential Manager; other platforms use a
# 0600 file.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = "4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "load"
harness = false
