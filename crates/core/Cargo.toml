[package]
name = "bible-core"
description = "Translation model, importers, search and study storage for bible-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled"]
# Embed the public-domain translations from data/translations into the binary.
bundled = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
zstd.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
ureq = "3"

# API keys live in the macOS Keychain; other platforms use a 0600 file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "load"
harness = false
