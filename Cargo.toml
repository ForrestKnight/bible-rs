[workspace]
resolver = "3"
members = ["crates/core", "xtask"]
default-members = ["crates/core", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/michaelshimeles/bible-rs"

[workspace.dependencies]
bible-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
strip = false


[profile.dev.package."*"]
opt-level = 2
