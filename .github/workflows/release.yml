# Builds the signed, notarized macOS release when a version tag is pushed and attaches it to a
# draft GitHub Release. Nothing is published: a maintainer reviews the draft and publishes it.
# scripts/release-macos.sh does the work; running it on a Mac is the primary path
# (RELEASING.md), this workflow is the same steps on a GitHub runner.
#
# The linux job builds the Linux archives (LINUX.md) and attaches them to the same draft. The
# windows job builds the Windows installer as a workflow artifact only; it attaches nothing to the
# release (WINDOWS.md). It is unsigned until Windows signing is set up.
#
# Repository secrets (Settings → Secrets and variables → Actions), set up in RELEASING.md:
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate and key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password the .p12 was exported with
#   NOTARY_API_KEY             contents of the App Store Connect API key file (AuthKey_….p8)
#   NOTARY_API_KEY_ID          that key's ID
#   NOTARY_API_ISSUER          the issuer ID shown above the keys list
#   SPARKLE_PRIVATE_KEY        the update signing key, exported with generate_keys -x
name: Release (macOS, Linux; Windows artifact)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the draft release

# This job holds the signing certificate and the notary key, so every action is pinned to a
# commit and no build cache is restored into it.

jobs:
  macos:
    name: Universal app, DMG and zip (signed, notarized)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

      - name: Secrets are set
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER SPARKLE_PRIVATE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::repository secret $name is not set (see RELEASING.md)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, for dmgbuild

      - name: Signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" >/dev/null
          # Put the new keychain first in the search list, keeping the existing ones.
          search=("$KEYCHAIN")
          while IFS= read -r k; do search+=("$k"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "${search[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Notary profile
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials bible-notary --keychain "$KEYCHAIN" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # generate_keys keeps the key in the runner's login keychain, where release-macos.sh
      # looks for it, as on a Mac.
      - name: Update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle="$(scripts/fetch-sparkle.sh)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed25519"
          "$sparkle/bin/generate_keys" --account bible-rs -f "$RUNNER_TEMP/sparkle-ed25519"
          rm -f "$RUNNER_TEMP/sparkle-ed25519"

      - name: Build, sign, notarize, staple
        run: NOTARY_KEYCHAIN="$KEYCHAIN" scripts/release-macos.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bible-rs-${{ github.ref_name }}-macos
          path: |
            dist/bible-rs-*universal.dmg
            dist/bible-rs-*-universal.zip
            dist/bible-rs-*-SHA256SUMS.txt
            dist/appcast.xml
          if-no-files-found: error

      # bible-rs-universal.dmg is the name simplymybible.com/download points at, and appcast.xml
      # the feed installed copies check.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/bible-rs-*universal.dmg dist/bible-rs-*-universal.zip dist/bible-rs-*-SHA256SUMS.txt dist/appcast.xml)
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none)
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
                --title "Bible ${GITHUB_REF_NAME#v}" "${assets[@]}" ;;
            true) # a draft made by hand keeps its notes; only the files change
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber ;;
            *) # never swap the files of a published release behind a maintainer's back
              echo "::notice::$GITHUB_REF_NAME is already published; its files were left alone (this run's artifact has the new build)" ;;
          esac

      - name: Remove the signing keychain
        if: always()
        run: if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  # The Linux archives, one per architecture, attached to the same draft release. They are not
  # signed: Linux checks the SHA-256 next to them, and distribution packages pin it again.
  linux:
    name: Linux archive (${{ matrix.arch }})
    needs: macos
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev

      - name: Build and package
        run: scripts/package-linux.sh

      - name: Archive contents
        run: tar -tzvf dist/bible-rs-*-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bible-rs-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: |
            dist/bible-rs-*-linux-${{ matrix.arch }}.tar.gz
            dist/bible-rs-*-linux-${{ matrix.arch }}-SHA256SUMS.txt
          if-no-files-found: error

      # Same rules as the macOS job: a draft is made or filled, a published release is left alone.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/bible-rs-*-linux-${{ matrix.arch }}.tar.gz dist/bible-rs-*-linux-${{ matrix.arch }}-SHA256SUMS.txt)
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none)
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
                --title "Bible ${GITHUB_REF_NAME#v}" "${assets[@]}" ;;
            true)
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber ;;
            *)
              echo "::notice::$GITHUB_REF_NAME is already published; its files were left alone (this run's artifact has the new build)" ;;
          esac

  # The Windows installer, as a workflow artifact. It never touches the GitHub Release.
  windows:
    name: Windows installer (artifact only)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: NSIS
        run: choco install nsis --version=3.13.0 --no-progress -y

      # Signing hook (WINDOWS.md, "Signing"). Skipped until the repository variable
      # WINDOWS_SIGNING is "artifact-signing". Then it needs the variables
      # ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE, and the
      # secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET of an app registration
      # with the "Artifact Signing Certificate Profile Signer" role.
      - name: Signing tools (Azure Artifact Signing)
        if: vars.WINDOWS_SIGNING == 'artifact-signing'
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/signing"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/nuget.exe" https://dist.nuget.org/win-x86-commandline/v6.14.0/nuget.exe
          "$tools/nuget.exe" install Microsoft.Windows.SDK.BuildTools -Version 10.0.28000.2705 -ExcludeVersion -OutputDirectory "$(cygpath -w "$tools")"
          "$tools/nuget.exe" install Microsoft.ArtifactSigning.Client -Version 1.0.146 -ExcludeVersion -OutputDirectory "$(cygpath -w "$tools")"
          signtool="$tools/Microsoft.Windows.SDK.BuildTools/bin/10.0.28000.0/x64/signtool.exe"
          dlib="$(cygpath -w "$tools/Microsoft.ArtifactSigning.Client/bin/x64/Azure.CodeSigning.Dlib.dll")"
          # Sign with the app registration's secret (EnvironmentCredential) and nothing else.
          cat > "$tools/metadata.json" <<JSON
          {
            "Endpoint": "$ENDPOINT",
            "CodeSigningAccountName": "$ACCOUNT",
            "CertificateProfileName": "$PROFILE",
            "ExcludeCredentials": ["ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzureCliCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"]
          }
          JSON
          metadata="$(cygpath -w "$tools/metadata.json")"
          {
            echo "SIGNTOOL=$signtool"
            echo "WINDOWS_SIGN_COMMAND=\"$(cygpath -w "$signtool")\" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib \"$dlib\" /dmdf \"$metadata\""
          } >> "$GITHUB_ENV"

      - name: Build and package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe" scripts/package-windows.sh

      - name: Installer contents
        run: 7z l dist/bible-rs-*-windows-x64-setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bible-rs-${{ github.ref_name }}-windows-x64${{ vars.WINDOWS_SIGNING != 'artifact-signing' && '-unsigned' || '' }}
          path: |
            dist/bible-rs-*-windows-x64-setup.exe
            dist/bible-rs-*-windows-x64-SHA256SUMS.txt
          if-no-files-found: error
