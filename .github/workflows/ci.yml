name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · fmt, clippy, tests, benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev xvfb mesa-utils x11-utils
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Search smoke test (release)
        run: cargo run --release -p bible-rs -- search "love one another" --limit 3
      - name: Benchmarks (quick)
        run: |
          cargo bench -p bible-core --bench search -- --warm-up-time 1 --measurement-time 2
          cargo bench -p bible-rs --bench layout -- --warm-up-time 1 --measurement-time 2
      - name: Startup and scrolling under Xvfb (software OpenGL)
        run: RUNS=5 scripts/bench-startup.sh

  macos:
    name: macOS · build, tests, universal app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10 # installs dmgbuild for the DMG layout
      - name: Tests
        run: cargo test --workspace
      - name: Universal app, DMG and zip (ad-hoc signed; release.yml signs and notarizes)
        run: scripts/release-macos.sh --ad-hoc
      - name: Startup and scrolling (glow)
        run: BIN=dist/bible-rs.app/Contents/MacOS/bible-rs BIBLE_RS_RENDERER=glow RUNS=10 scripts/bench-startup.sh || true
      - name: Startup and scrolling (wgpu / Metal)
        run: BIN=dist/bible-rs.app/Contents/MacOS/bible-rs BIBLE_RS_RENDERER=wgpu RUNS=10 scripts/bench-startup.sh || true
      - name: Startup phases
        run: |
          for r in glow wgpu; do
            echo "== $r"
            BIBLE_RS_HOME="$(mktemp -d)" BIBLE_RS_RENDERER=$r BIBLE_RS_TRACE_STARTUP=1 BIBLE_RS_STARTUP_PROBE=1 \
              dist/bible-rs.app/Contents/MacOS/bible-rs 2>&1 | tail -20 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bible-rs-macos
          path: |
            dist/bible-rs-*-universal.dmg
