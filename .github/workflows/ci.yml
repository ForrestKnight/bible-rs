name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · fmt, clippy, tests, benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev xvfb mesa-utils x11-utils
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Search smoke test (release)
        run: cargo run --release -p bible-rs -- search "love one another" --limit 3
      - name: Benchmarks (quick)
        run: |
          cargo bench -p bible-core --bench search -- --warm-up-time 1 --measurement-time 2
          cargo bench -p bible-rs --bench layout -- --warm-up-time 1 --measurement-time 2
      - name: Startup and scrolling under Xvfb (software OpenGL)
        run: RUNS=5 scripts/bench-startup.sh

  windows:
    name: Windows · clippy, tests, unsigned installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # The runner's clock is UTC; local times (history, plan days) need a real offset to test.
      - name: Local time east of UTC
        run: |
          tzutil //s "AUS Eastern Standard Time"
          cargo test -p bible-rs --lib time::
      - name: Search smoke test (release)
        run: cargo run --release -p bible-rs -- search "love one another" --limit 3
      # Opens the window, renders the first frame with Direct3D 12 (the runner has no GPU, so
      # Windows' software renderer) and exits.
      - name: Startup (Direct3D 12)
        run: |
          BIBLE_RS_HOME="$(mktemp -d)" BIBLE_RS_TRACE_STARTUP=1 BIBLE_RS_STARTUP_PROBE=1 \
            timeout 120 target/release/bible-rs.exe 2>&1 | tail -20
      - name: NSIS
        run: choco install nsis --version=3.13.0 --no-progress -y
      - name: Installer (unsigned; release.yml can sign, WINDOWS.md)
        run: BIN=target/release/bible-rs.exe MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe" scripts/package-windows.sh
      - name: Installer contents
        run: 7z l dist/bible-rs-*-windows-x64-setup.exe
      - name: Install, open and uninstall (silently)
        run: |
          set -x
          key='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\bible-rs'
          dir="$(cygpath -u "$LOCALAPPDATA")/Programs/Bible"
          link="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Bible.lnk"
          setup=(dist/bible-rs-*-windows-x64-setup.exe)
          # `//S` is /S once Git Bash has turned it back from a path.
          "${setup[0]}" //S
          ls -l "$dir" "$link"
          reg query "$key" | tee reg.txt
          grep -q 'Publisher.*Fabrika LLC' reg.txt
          BIBLE_RS_HOME="$(mktemp -d)" BIBLE_RS_STARTUP_PROBE=1 timeout 120 "$dir/bible-rs.exe" | tail -1
          "$dir/Uninstall Bible.exe" //S
          # The uninstaller runs from a copy in %TEMP% and returns at once.
          for _ in $(seq 60); do [ -e "$dir" ] || break; sleep 1; done
          [ ! -e "$dir" ] && [ ! -e "$link" ] && ! reg query "$key" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: bible-rs-windows-x64-unsigned
          path: |
            dist/bible-rs-*-windows-x64-setup.exe
            dist/bible-rs-*-windows-x64-SHA256SUMS.txt
          if-no-files-found: error

  objects:
    name: Object specs · schema, verses and quotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site packages (the check uses ajv and the core's wasm from site/)
        working-directory: site
        run: npm ci
      - name: objects/*.json against the KJV and BSB
        run: node site/src/lib/objects/check.mjs

  ios:
    name: iOS · framework, simulator and device builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: XcodeGen
        run: brew install xcodegen && xcodebuild -version
      - name: Simulator build
        run: scripts/build-ios.sh
      - name: Device build (unsigned)
        run: scripts/build-ios.sh --device

  macos:
    name: macOS · build, tests, universal app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes exact version tags only; installs dmgbuild for the DMG layout.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Tests
        run: cargo test --workspace
      - name: Universal app, DMG and zip (ad-hoc signed; release.yml signs and notarizes)
        run: scripts/release-macos.sh --ad-hoc
      - name: Startup and scrolling (glow)
        run: BIN=dist/Bible.app/Contents/MacOS/Bible BIBLE_RS_RENDERER=glow RUNS=10 scripts/bench-startup.sh || true
      - name: Startup and scrolling (wgpu / Metal)
        run: BIN=dist/Bible.app/Contents/MacOS/Bible BIBLE_RS_RENDERER=wgpu RUNS=10 scripts/bench-startup.sh || true
      - name: Startup phases
        run: |
          for r in glow wgpu; do
            echo "== $r"
            BIBLE_RS_HOME="$(mktemp -d)" BIBLE_RS_RENDERER=$r BIBLE_RS_TRACE_STARTUP=1 BIBLE_RS_STARTUP_PROBE=1 \
              dist/Bible.app/Contents/MacOS/Bible 2>&1 | tail -20 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bible-rs-macos
          path: |
            dist/bible-rs-*-universal.dmg
