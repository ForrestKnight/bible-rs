name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · fmt, clippy, tests, benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev xvfb mesa-utils x11-utils
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Search smoke test (release)
        run: cargo run --release -p bible-rs -- search "love one another" --limit 3
      - name: Benchmarks (quick)
        run: |
          cargo bench -p bible-core --bench search -- --warm-up-time 1 --measurement-time 2
          cargo bench -p bible-rs --bench layout -- --warm-up-time 1 --measurement-time 2
      - name: Startup and scrolling under Xvfb (software OpenGL)
        run: RUNS=5 scripts/bench-startup.sh

  macos:
    name: macOS · build, tests, app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: App bundle and DMG
        run: scripts/bundle-macos.sh
      - name: Startup probe
        run: RUNS=5 scripts/bench-startup.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: bible-rs-macos
          path: |
            dist/*.dmg
